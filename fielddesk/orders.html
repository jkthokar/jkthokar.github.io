<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장데스크 발주 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  /* 현장데스크 suite look: cool label paper, 냉장 blue for data, safety orange for the one main action.
     layout: header / 1 drop + column check / 2 result tiles + sheet tabs / settings drawer */
  --paper: #eef2f2; --card: #ffffff; --ink: #14212b; --muted: #5a6871; --line: #cbd4d7;
  --cold: #2c6a88; --cold-soft: #dcebf2; --signal: #e2591f; --signal-soft: #fbe4d8;
  --ok: #2d7a4b; --ok-soft: #dff1e6; --bad: #b8322a; --bad-soft: #fbe3e0; --warn: #a8670a; --warn-soft: #fbefd6;
  --display: "Do Hyeon", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161b; --card: #172128; --ink: #e4ecef; --muted: #98a8b1; --line: #2c3a43;
    --cold: #7db6d2; --cold-soft: #1b3240; --signal: #ff8549; --signal-soft: #3b2418;
    --ok: #6cc592; --ok-soft: #173326; --bad: #f08a80; --bad-soft: #3a1f1c; --warn: #e8b35a; --warn-soft: #3a2d15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161b; --card: #172128; --ink: #e4ecef; --muted: #98a8b1; --line: #2c3a43;
  --cold: #7db6d2; --cold-soft: #1b3240; --signal: #ff8549; --signal-soft: #3b2418;
  --ok: #6cc592; --ok-soft: #173326; --bad: #f08a80; --bad-soft: #3a1f1c; --warn: #e8b35a; --warn-soft: #3a2d15;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.mono, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 18px; }

.top { border-bottom: 1px solid var(--line); background: var(--card); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 58px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.brand span { color: var(--muted); font-size: 14px; }
.top .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.b { border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.b:hover { border-color: var(--cold); }
.b.go { background: var(--cold); border-color: var(--cold); color: #fff; }
.b.hot { background: var(--signal); border-color: var(--signal); color: #fff; }
.b.sm { padding: 3px 10px; font-size: 13px; }
.b:disabled { opacity: .45; cursor: default; }

main { padding: 20px 0 50px; display: grid; gap: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.ch { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ch h2 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 10px; }
.ch h2 .step { font-family: var(--mono); font-size: 12px; color: #fff; background: var(--cold); border-radius: 5px; padding: 1px 7px; }
.ch .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cb { padding: 16px 18px; display: grid; gap: 14px; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 18px; text-align: center; background: var(--paper); cursor: pointer; }
.drop.over { border-color: var(--cold); background: var(--cold-soft); }
.drop b { font-size: 16px; display: block; }
.drop small { color: var(--muted); }
.files { display: grid; gap: 10px; }
.file { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.fh { display: flex; gap: 10px; align-items: center; padding: 9px 12px; background: var(--paper); flex-wrap: wrap; }
.fh b { word-break: break-all; }
.fh .meta { color: var(--muted); font-size: 13px; }
.fh .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 10px 12px; }
.map label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.map label.need span::after { content: " *"; color: var(--bad); }
.map select, .map input, .set input, .set select, .set textarea, .search { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--card); font-size: 13.5px; width: 100%; }
.map select.miss { border-color: var(--bad); background: var(--bad-soft); }

.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.tile small { display: block; color: var(--muted); font-size: 12px; }
.tile b { font-family: var(--mono); font-size: 21px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.msg { padding: 9px 13px; border-radius: 8px; border-left: 4px solid; font-size: 14px; }
.msg.ok { background: var(--ok-soft); border-color: var(--ok); }
.msg.bad { background: var(--bad-soft); border-color: var(--bad); }
.msg.warn { background: var(--warn-soft); border-color: var(--warn); }
.msg.info { background: var(--cold-soft); border-color: var(--cold); }

.sheets { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sheets button { border: 0; background: none; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.sheets button[aria-selected="true"] { color: var(--cold); border-color: var(--cold); }
.sheets button .cnt { font-family: var(--mono); font-size: 12px; margin-left: 4px; }
.sheets button .cnt.badc { color: var(--bad); }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tools .search { max-width: 260px; }
.tw { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--paper); color: var(--muted); font-weight: 600; font-size: 12.5px; position: sticky; top: 0; white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
td.nw { white-space: nowrap; }
tr.tot td { font-weight: 700; background: var(--paper); position: sticky; bottom: 0; }
tr.bad td { background: var(--bad-soft); }
tr.warn td { background: var(--warn-soft); }
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.cold { background: var(--cold-soft); color: var(--cold); }
.dim { color: var(--muted); }
.empty { color: var(--muted); padding: 20px; text-align: center; }

.set { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 820px) { .set { grid-template-columns: 1fr; } }
.set h3 { font-size: 15px; margin: 0 0 4px; }
.set p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.rules { display: grid; gap: 6px; }
.rule { display: grid; grid-template-columns: 1fr 18px 1fr 30px; gap: 6px; align-items: center; }
.rule span { text-align: center; color: var(--muted); }
.opt { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.opt input { width: auto; }
footer { color: var(--muted); font-size: 12.5px; padding: 0 0 30px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b data-k="brand">현장데스크</b><span data-k="tool">발주 정리</span></div>
    <div class="acts">
      <button class="b" id="btn-sample" type="button" data-k="sample">예시 데이터로 해보기</button>
      <button class="b" id="btn-settings" type="button" aria-expanded="false" data-k="settings">설정</button>
      <button class="b" id="btn-lang" type="button">English</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card" id="settings" hidden>
    <div class="ch"><h2 data-k="set_h">설정</h2><div class="right"><button class="b sm" id="set-close" type="button" data-k="close">닫기</button></div></div>
    <div class="cb set">
      <div>
        <h3 data-k="rn_h">상품명 바꾸기</h3>
        <p data-k="rn_p">상품명에 왼쪽 글자가 들어 있으면 오른쪽 이름으로 집계합니다. 띄어쓰기 · 대소문자는 무시합니다. 위에서부터 먼저 맞는 규칙 하나만 씁니다.</p>
        <div class="rules" id="rules"></div>
        <div style="margin-top:8px"><button class="b sm" id="rule-add" type="button" data-k="rule_add">+ 규칙 추가</button></div>
      </div>
      <div style="display:grid;gap:14px;align-content:start">
        <div>
          <h3 data-k="ex_h">제외할 상품</h3>
          <p data-k="ex_p">상품명에 이 단어가 있으면 정리에서 빼고 확인사항에 남깁니다. 쉼표로 구분.</p>
          <input id="set-exclude" type="text" placeholder="예: 사은품, 샘플">
        </div>
        <div>
          <h3 data-k="pk_h">택배 묶기 기준</h3>
          <select id="set-pack">
            <option value="name_phone_addr" data-k="pk1">받는 분 + 연락처 + 주소가 같으면 한 상자</option>
            <option value="phone_addr" data-k="pk2">연락처 + 주소가 같으면 한 상자</option>
            <option value="none" data-k="pk3">묶지 않음 (주문 한 줄 = 한 상자)</option>
          </select>
        </div>
        <label class="opt"><input id="set-option" type="checkbox"> <span data-k="opt_p">옵션을 상품명 뒤에 붙여서 다른 상품으로 집계</span></label>
        <p class="dim" style="margin:0;font-size:12.5px" data-k="set_note">설정은 이 브라우저에만 저장됩니다.</p>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="ch"><h2><span class="step">1</span><span data-k="s1">주문 파일 넣기</span></h2>
      <div class="right"><button class="b sm" id="btn-clear" type="button" data-k="clear" hidden>모두 지우기</button></div></div>
    <div class="cb">
      <label class="drop" id="drop" for="file-in">
        <b data-k="drop_b">쇼핑몰 주문 엑셀을 여기에 끌어다 놓으세요</b>
        <small data-k="drop_s">.xlsx · .xls · .csv 여러 개 가능 · 클릭해서 선택 · 파일은 이 컴퓨터 밖으로 나가지 않습니다</small>
      </label>
      <input type="file" id="file-in" class="sr" multiple accept=".xlsx,.xls,.csv">
      <div class="files" id="files"></div>
    </div>
  </section>

  <section class="card">
    <div class="ch"><h2><span class="step">2</span><span data-k="s2">정리 결과</span></h2>
      <div class="right"><button class="b hot" id="btn-download" type="button" data-k="download" disabled>엑셀 내려받기</button></div></div>
    <div class="cb" id="result"></div>
  </section>

  <footer data-k="foot">현장데스크 발주 정리 · 주문 파일은 브라우저 안에서만 처리됩니다.</footer>
</main>

<script>
"use strict";
// ================================================================ text
const EN = {
  brand: "Field Desk", tool: "Order Sorter", sample: "Try example data", settings: "Settings", close: "Close",
  set_h: "Settings", rn_h: "Rename products",
  rn_p: "If a product name contains the text on the left, it is counted under the name on the right. Spaces and upper/lower case are ignored. Only the first matching rule is used.",
  rule_add: "+ Add rule", ex_h: "Leave out", ex_p: "Products whose name contains one of these words are left out and listed in the notes. Separate with commas.",
  pk_h: "Parcel grouping", pk1: "Same recipient + phone + address = one box", pk2: "Same phone + address = one box", pk3: "No grouping (one order line = one box)",
  opt_p: "Add the option to the product name and count it as a separate product", set_note: "Settings are saved in this browser only.",
  s1: "Add order files", clear: "Remove all", drop_b: "Drop shop order Excel files here",
  drop_s: ".xlsx · .xls · .csv, several at once · click to choose · files never leave this computer",
  s2: "Result", download: "Download Excel", foot: "Field Desk Order Sorter · order files are processed inside the browser only."
};
const KO = {};
document.querySelectorAll("[data-k]").forEach(el => { if (!(el.dataset.k in KO)) KO[el.dataset.k] = el.textContent; });
let LANG = "ko";
const L = (ko, en) => LANG === "en" ? en : ko;
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = LANG === "en" ? (EN[el.dataset.k] ?? KO[el.dataset.k]) : KO[el.dataset.k]; });
  document.getElementById("btn-lang").textContent = LANG === "en" ? "한국어" : "English";
  document.getElementById("set-exclude").placeholder = L("예: 사은품, 샘플", "e.g. gift, sample");
  renderFiles(); renderRules(); render();
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("fd-orders-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("fd-orders-" + k, JSON.stringify(v)); } catch (e) { /* no storage: works for this visit */ } }
};
LANG = store.get("lang", "ko");
document.getElementById("btn-lang").onclick = () => { LANG = LANG === "en" ? "ko" : "en"; store.set("lang", LANG); applyLang(); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => (Math.round(n * 100) / 100).toLocaleString("ko-KR");

// ================================================================ settings
const settings = {
  rules: store.get("rules", []),            // [{from, to}]
  exclude: store.get("exclude", ""),
  pack: store.get("pack", "name_phone_addr"),
  option: store.get("option", false),
};
function saveSettings() { Object.entries(settings).forEach(([k, v]) => store.set(k, v)); }
const setBox = document.getElementById("settings"), setBtn = document.getElementById("btn-settings");
setBtn.onclick = () => { setBox.hidden = !setBox.hidden; setBtn.setAttribute("aria-expanded", String(!setBox.hidden)); };
document.getElementById("set-close").onclick = () => { setBox.hidden = true; setBtn.setAttribute("aria-expanded", "false"); };
const exIn = document.getElementById("set-exclude"), packIn = document.getElementById("set-pack"), optIn = document.getElementById("set-option");
exIn.value = settings.exclude; packIn.value = settings.pack; optIn.checked = settings.option;
exIn.oninput = () => { settings.exclude = exIn.value; saveSettings(); render(); };
packIn.onchange = () => { settings.pack = packIn.value; saveSettings(); render(); };
optIn.onchange = () => { settings.option = optIn.checked; saveSettings(); render(); };
function renderRules() {
  const box = document.getElementById("rules");
  if (!settings.rules.length) { box.innerHTML = `<div class="dim" style="font-size:13px">${L("규칙 없음", "No rules yet")}</div>`; return; }
  box.innerHTML = settings.rules.map((r, i) => `<div class="rule">
    <input type="text" id="rf${i}" aria-label="${L("포함하는 글자", "Contains")}" value="${esc(r.from)}" placeholder="${L("포함하는 글자", "contains")}">
    <span>→</span>
    <input type="text" id="rt${i}" aria-label="${L("집계 이름", "Count as")}" value="${esc(r.to)}" placeholder="${L("집계 이름", "count as")}">
    <button class="b sm" type="button" data-del="${i}" aria-label="${L("삭제", "Delete")}">×</button></div>`).join("");
  settings.rules.forEach((r, i) => {
    document.getElementById("rf" + i).onchange = e => { r.from = e.target.value; saveSettings(); render(); };
    document.getElementById("rt" + i).onchange = e => { r.to = e.target.value; saveSettings(); render(); };
  });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { settings.rules.splice(+b.dataset.del, 1); saveSettings(); renderRules(); render(); });
}
document.getElementById("rule-add").onclick = () => { settings.rules.push({ from: "", to: "" }); saveSettings(); renderRules(); };

// ================================================================ reading files
const FIELDS = [
  { k: "shop", ko: "쇼핑몰", en: "Shop", words: ["쇼핑몰", "판매처", "마켓", "채널", "몰"] },
  { k: "no", ko: "주문번호", en: "Order no.", words: ["주문번호", "주문 번호", "order no", "orderno", "주문코드"] },
  { k: "to", ko: "받는 분", en: "Recipient", need: true, words: ["수취인명", "수취인", "받는분", "받는 분", "수령인", "수령자", "받으시는분", "recipient"] },
  { k: "phone", ko: "연락처", en: "Phone", words: ["수취인연락처", "수취인 연락처", "수취인전화", "받는분전화", "휴대폰", "핸드폰", "연락처", "전화번호", "전화", "phone"] },
  { k: "addr", ko: "주소", en: "Address", need: true, words: ["배송지", "배송주소", "수취인주소", "받는분주소", "주소", "address"] },
  { k: "name", ko: "상품명", en: "Product", need: true, words: ["상품명", "품목명", "품명", "제품명", "상품", "product"] },
  { k: "option", ko: "옵션", en: "Option", words: ["옵션정보", "옵션명", "옵션", "option"] },
  { k: "qty", ko: "수량", en: "Qty", need: true, words: ["주문수량", "수량", "개수", "qty", "quantity"] },
  { k: "memo", ko: "배송메모", en: "Delivery note", words: ["배송메시지", "배송메모", "배송요청", "요청사항", "메모"] },
];
const norm = s => String(s ?? "").replace(/\s+/g, "").toLowerCase();
function findHeader(aoa) {
  let best = -1, score = 0;
  for (let r = 0; r < Math.min(aoa.length, 15); r++) {
    const cells = (aoa[r] || []).map(norm);
    const sc = FIELDS.filter(f => cells.some(c => c && f.words.some(w => c === norm(w) || c.includes(norm(w))))).length;
    if (sc > score) { score = sc; best = r; }
  }
  return score >= 2 ? best : -1;
}
function guessMap(head) {
  const cells = head.map(norm), used = new Set(), map = {};
  // exact header words first, then "contains"
  for (const pass of ["exact", "contains"]) {
    FIELDS.forEach(f => {
      if (map[f.k] != null) return;
      for (const w of f.words) {
        const i = cells.findIndex((c, j) => !used.has(j) && c && (pass === "exact" ? c === norm(w) : c.includes(norm(w))));
        if (i >= 0) { map[f.k] = i; used.add(i); return; }
      }
    });
  }
  return map;
}
let FILES = [];      // {id, name, aoa, head, map, shop}
let fileSeq = 0;
function addTable(name, aoa) {
  aoa = aoa.map(r => r || []);            // keep blank rows so row numbers match Excel
  const h = findHeader(aoa);
  const f = { id: ++fileSeq, name, aoa, head: h, map: h >= 0 ? guessMap(aoa[h]) : {}, shop: name.replace(/\.(xlsx|xls|csv)$/i, "") };
  FILES.push(f);
}
async function readFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true, codepage: 949 });
  const ws = wb.Sheets[wb.SheetNames[0]];
  addTable(file.name, XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" }));
}
async function addFiles(list) {
  const errs = [];
  for (const f of list) {
    if (!/\.(xlsx|xls|csv)$/i.test(f.name)) { errs.push(L(`${f.name}: 엑셀(.xlsx .xls) 또는 .csv 파일만 넣을 수 있습니다.`, `${f.name}: only Excel (.xlsx .xls) or .csv files.`)); continue; }
    try { await readFile(f); } catch (e) { errs.push(L(`${f.name}: 파일을 읽지 못했습니다. 엑셀에서 열어 다른 이름으로 저장(.xlsx)한 뒤 다시 넣어 보세요.`, `${f.name}: could not read it. Open it in Excel, save as .xlsx and try again.`)); }
  }
  fileErrors = errs;
  renderFiles(); render();
}
let fileErrors = [];
const drop = document.getElementById("drop"), fileIn = document.getElementById("file-in");
fileIn.onchange = () => { addFiles([...fileIn.files]); fileIn.value = ""; };
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles([...e.dataTransfer.files]));
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { if (!drop.contains(e.target)) { e.preventDefault(); addFiles([...e.dataTransfer.files]); } });

        <button class="b sm" type="button" data-rm="${f.id}">${L("빼기", "Remove")}</button></div></div>

    </div>`;
  }).join("");
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { FILES = FILES.filter(f => f.id !== +b.dataset.rm); renderFiles(); render(); });
  box.querySelectorAll("select[data-f]").forEach(s => s.onchange = () => {
    const f = FILES.find(x => x.id === +s.dataset.f); f.map[s.dataset.k] = s.value === "" ? null : +s.value; renderFiles(); render();
  });
  FILES.forEach(f => { const el = document.getElementById("shop" + f.id); if (el) el.onchange = () => { f.shop = el.value.trim() || f.name; render(); }; });

// ================================================================ sorting
const UNIT_G = { g: 1, kg: 1000, ml: 1, l: 1000 };
function cleanName(s) { return String(s ?? "").replace(/[\t\r\n ]+/g, " ").replace(/ {2,}/g, " ").trim(); }
function unitCase(s) { return s.replace(/(\d)(\s?)(kg|ml|g|l)(?![a-z가-힣])/gi, (_, d, sp, u) => d + sp + u.toLowerCase()); }
function splitWeight(name) {
  // last "250g" / "1.5kg" / "500ml" in the name -> item + weight label + grams
  const re = /(\d+(?:\.\d+)?)\s?(kg|ml|g|l)(?![a-z])/gi;
  let m, last = null;
  while ((m = re.exec(name))) last = m;
  if (!last) return { item: name, w: "", grams: null };
  const unit = last[2].toLowerCase();
  const item = (name.slice(0, last.index) + name.slice(last.index + last[0].length)).replace(/[\s_\-·,/()]+$/g, "").replace(/\(\s*\)/g, "").replace(/ {2,}/g, " ").trim();
  return { item: item || name, w: last[1] + unit, grams: parseFloat(last[1]) * UNIT_G[unit] };
}
function toQty(v) {
  const s = String(v ?? "").replace(/[,\s개ea]/gi, "");
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}
function sortAll() {
  const notes = [], lines = [], excluded = [], bad = [];
  const ex = settings.exclude.split(",").map(s => norm(s)).filter(Boolean);
  const rules = settings.rules.filter(r => norm(r.from) && r.to.trim());
  let rawTotal = 0;
  FILES.forEach(f => {
    if (f.head < 0 || FIELDS.some(x => x.need && f.map[x.k] == null)) return;
    const get = (row, k) => f.map[k] == null ? "" : row[f.map[k]];
    for (let r = f.head + 1; r < f.aoa.length; r++) {
      const row = f.aoa[r] || [], rowNo = r + 1;
      const rawName = String(get(row, "name") ?? "");
      const opt = cleanName(get(row, "option"));
      const q = toQty(get(row, "qty"));
      const where = `${f.shop} ${L(rowNo + "행", "row " + rowNo)}`;
      if (!rawName.trim() && !String(get(row, "qty")).trim()) continue;
      if (!rawName.trim()) { bad.push({ where, kind: L("상품명 없음", "No product name"), detail: "" }); continue; }
      if (q == null || q <= 0) { bad.push({ where, kind: L("수량 오류", "Bad quantity"), detail: `${cleanName(rawName)} · "${get(row, "qty")}"` }); continue; }
      rawTotal += q;
      let name = cleanName(rawName);
      if (name !== rawName) notes.push({ where, kind: L("탭 · 공백 정리", "Tabs · spaces"), from: rawName, to: name });
      const u = unitCase(name);
      if (u !== name) { notes.push({ where, kind: L("단위 소문자 통일", "Unit case"), from: name, to: u }); name = u; }
      if (settings.option && opt) name = `${name} [${opt}]`;
      if (ex.length && ex.some(w => norm(name).includes(w))) { excluded.push({ where, name, q }); continue; }
      const rule = rules.find(x => norm(name).includes(norm(x.from)));
      if (rule) { notes.push({ where, kind: L("규칙으로 이름 변경", "Renamed by rule"), from: name, to: rule.to.trim() }); name = rule.to.trim(); }
      lines.push({
        shop: cleanName(get(row, "shop")) || f.shop, no: cleanName(get(row, "no")), to: cleanName(get(row, "to")),
        phone: cleanName(get(row, "phone")), addr: cleanName(get(row, "addr")), name, option: opt, q, memo: cleanName(get(row, "memo")), where
      });
    }
  });
  // one spelling per product: names that differ only in spaces / upper-lower case are the same product
  const canon = new Map();
  lines.forEach(l => {
    const k = norm(l.name);
    if (!canon.has(k)) canon.set(k, l.name);
    else if (canon.get(k) !== l.name) { notes.push({ where: l.where, kind: L("같은 상품으로 합침", "Merged as same product"), from: l.name, to: canon.get(k) }); l.name = canon.get(k); }
  });
  // same order number + product twice (file added twice?)
  const seen = new Map(), dups = [];
  lines.forEach(l => { if (!l.no) return; const k = l.shop + "|" + l.no + "|" + l.name; if (seen.has(k)) dups.push({ where: l.where, first: seen.get(k), name: l.name }); else seen.set(k, l.where); });
  // summary
  const agg = new Map();
  lines.forEach(l => {
    const sw = splitWeight(l.name);
    const k = l.name;
    if (!agg.has(k)) agg.set(k, { name: l.name, item: sw.item, w: sw.w, grams: sw.grams, q: 0, n: 0 });
    const a = agg.get(k); a.q += l.q; a.n += 1;
  });
  const summary = [...agg.values()].sort((a, b) => a.item.localeCompare(b.item, "ko") || (a.grams ?? 0) - (b.grams ?? 0));
  const weights = [...new Set(summary.filter(s => s.w).map(s => s.w))].sort((a, b) => splitWeight("x " + a).grams - splitWeight("x " + b).grams);
  const items = [...new Set(summary.map(s => s.item))];
  // parcels
  const pk = l => settings.pack === "none" ? l.where : settings.pack === "phone_addr" ? norm(l.phone) + "|" + norm(l.addr) : norm(l.to) + "|" + norm(l.phone) + "|" + norm(l.addr);
  const pmap = new Map();
  lines.forEach(l => { const k = pk(l); if (!pmap.has(k)) pmap.set(k, { to: l.to, phone: l.phone, addr: l.addr, memo: new Set(), nos: new Set(), shops: new Set(), items: new Map(), q: 0 }); const p = pmap.get(k);
    if (l.memo) p.memo.add(l.memo); if (l.no) p.nos.add(l.no); p.shops.add(l.shop); p.items.set(l.name, (p.items.get(l.name) || 0) + l.q); p.q += l.q; });
  const parcels = [...pmap.values()];
  const missing = lines.filter(l => !l.addr || !l.to).map(l => ({ where: l.where, kind: L("받는 분 · 주소 없음", "No recipient or address"), detail: l.name }));
  const totals = {
    raw: rawTotal, excluded: excluded.reduce((a, x) => a + x.q, 0),
    lines: lines.reduce((a, l) => a + l.q, 0), summary: summary.reduce((a, s) => a + s.q, 0), parcels: parcels.reduce((a, p) => a + p.q, 0)
  };
  return { lines, summary, weights, items, parcels, notes, excluded, bad: bad.concat(missing), dups, totals };
}

// ================================================================ result screen
let SHEET = "orders", QUERY = "", RES = null;
function render() {
  const box = document.getElementById("result"), dl = document.getElementById("btn-download");
  const ready = FILES.filter(f => f.head >= 0 && !FIELDS.some(x => x.need && f.map[x.k] == null));

    RES = null; dl.disabled = true;
    box.innerHTML = `<div class="empty">${L("주문 파일을 넣으면 여기에 발주 · 택배 · 집계 · 확인사항이 나옵니다. 처음이면 위의 <b>예시 데이터로 해보기</b>를 눌러 보세요.", "Add order files and the orders, parcels, summary and notes appear here. New here? Press <b>Try example data</b> at the top.")}</div>`;
    return;
  }
  if (!ready.length) { RES = null; dl.disabled = true; box.innerHTML = `<div class="msg warn">${L("파일마다 빨간 칸(받는 분 · 주소 · 상품명 · 수량)을 골라 주세요.", "Pick the red columns (recipient, address, product, qty) for each file.")}</div>`; return; }

  const t = r.totals, okTotal = t.raw - t.excluded === t.lines && t.lines === t.summary && t.summary === t.parcels;

  const checkCount = r.bad.length + r.dups.length;

    ["parcels", L("택배", "Parcels"), r.parcels.length],
    ["summary", L("집계", "Summary"), r.summary.length],
    ["notes", L("확인사항", "Notes"), r.notes.length + r.excluded.length + checkCount, checkCount > 0],
  ];
  let html = `<div class="tiles">
    <div class="tile"><small>${L("파일", "Files")}</small><b>${ready.length}</b></div>
    <div class="tile"><small>${L("주문 줄", "Order lines")}</small><b>${fmt(r.lines.length)}</b></div>
    <div class="tile"><small>${L("총 수량", "Total qty")}</small><b>${fmt(t.lines)}</b></div>
    <div class="tile"><small>${L("상품", "Products")}</small><b>${fmt(r.summary.length)}</b></div>
    <div class="tile"><small>${L("택배 상자", "Parcels")}</small><b>${fmt(r.parcels.length)}</b></div></div>`;
  html += okTotal
    ? `<div class="msg ok">✔ ${L("합계 확인", "Totals check")}: ${L("원본", "orders")} ${fmt(t.raw)}${t.excluded ? ` − ${L("제외", "left out")} ${fmt(t.excluded)}` : ""} = ${L("발주", "orders sheet")} ${fmt(t.lines)} = ${L("집계", "summary")} ${fmt(t.summary)} = ${L("택배", "parcels")} ${fmt(t.parcels)}</div>`
    : `<div class="msg bad">✖ ${L("합계가 맞지 않습니다", "Totals do not match")}: ${fmt(t.raw)} / ${fmt(t.lines)} / ${fmt(t.summary)} / ${fmt(t.parcels)}</div>`;
  if (waiting) html += `<div class="msg warn">${L(`${waiting}개 파일은 칸을 고르기 전이라 아직 빠져 있습니다.`, `${waiting} file(s) left out until their columns are picked.`)}</div>`;
  if (checkCount) html += `<div class="msg bad">${L(`확인할 줄 ${checkCount}개가 있습니다. 확인사항 시트를 보세요.`, `${checkCount} line(s) need checking. See the Notes sheet.`)}</div>`;
  if (r.notes.length) html += `<div class="msg info">${L(`상품명 ${r.notes.length}곳을 자동으로 고쳤습니다 (확인사항에 원래 값과 함께 기록).`, `${r.notes.length} product name(s) fixed automatically (listed in Notes with the original).`)}</div>`;
  html += `<div class="sheets" role="tablist">${sheets.map(([k, n, c, b]) => `<button type="button" role="tab" data-sheet="${k}" aria-selected="${SHEET === k}">${n}<span class="cnt ${b ? "badc" : ""}">${c}</span></button>`).join("")}</div>

const hit = (...v) => !QUERY || v.join(" ").toLowerCase().includes(QUERY.toLowerCase());

      ${rows.map((p, i) => `<tr><td class="mono">${i + 1}</td><td class="nw">${esc(p.to)}${p.nos.size > 1 ? ` <span class="pill cold">${L("묶음", "grouped")} ${p.nos.size}</span>` : ""}</td><td class="mono nw">${esc(p.phone)}</td><td>${esc(p.addr)}</td><td>${[...p.items].map(([n, q]) => `${esc(n)} ×${fmt(q)}`).join("<br>")}</td><td class="n">${fmt(p.q)}</td><td class="mono">${[...p.nos].map(esc).join("<br>")}</td><td class="dim">${[...p.memo].map(esc).join(" / ")}</td></tr>`).join("")}
      <tr class="tot"><td colspan="5">${L("합계", "Total")} (${rows.length} ${L("상자", "boxes")})</td><td class="n">${fmt(rows.reduce((a, p) => a + p.q, 0))}</td><td colspan="2"></td></tr></table>`;
  } else if (SHEET === "summary") {

    const ws = r.weights, hasNoW = r.summary.some(s => !s.w);

    el.innerHTML = `<table><tr><th>${L("품목", "Item")}</th>${ws.map(w => `<th class="n">${w}</th>`).join("")}${hasNoW ? `<th class="n">${L("중량 없음", "No weight")}</th>` : ""}<th class="n">${L("총수량", "Total")}</th><th class="n">${L("총무게(kg)", "Weight (kg)")}</th></tr>
      ${items.map(it => { const tot = r.summary.filter(s => s.item === it).reduce((a, s) => a + s.q, 0);
        return `<tr><td>${esc(it)}</td>${ws.map(w => { const v = cell(it, w); return `<td class="n">${v ? fmt(v) : ""}</td>`; }).join("")}${hasNoW ? `<td class="n">${cell(it, "") ? fmt(cell(it, "")) : ""}</td>` : ""}<td class="n"><b>${fmt(tot)}</b></td><td class="n">${fmt(Math.round(kg(it) * 10) / 10)}</td></tr>`; }).join("")}
      <tr class="tot"><td>${L("합계", "Total")}</td>${ws.map(w => `<td class="n">${fmt(r.summary.filter(s => s.w === w && items.includes(s.item)).reduce((a, s) => a + s.q, 0))}</td>`).join("")}${hasNoW ? `<td class="n">${fmt(r.summary.filter(s => !s.w && items.includes(s.item)).reduce((a, s) => a + s.q, 0))}</td>` : ""}<td class="n">${fmt(r.summary.filter(s => items.includes(s.item)).reduce((a, s) => a + s.q, 0))}</td><td class="n">${fmt(Math.round(items.reduce((a, it) => a + kg(it), 0) * 10) / 10)}</td></tr></table>`;

      ...r.excluded.map(x => ({ c: "warn", kind: L("제외", "Left out"), where: x.where, a: `${x.name} ×${fmt(x.q)}`, b: L("설정의 제외 단어", "leave-out word in settings") })),
      ...r.notes.map(n => ({ c: "", kind: n.kind, where: n.where, a: n.from.replace(/\t/g, "⇥").replace(/ {2}/g, "␣␣"), b: n.to })),
    ].filter(x => hit(x.kind, x.where, x.a, x.b));
    el.innerHTML = rows.length ? `<table><tr><th>${L("구분", "Kind")}</th><th>${L("위치", "Where")}</th><th>${L("원래", "Was")}</th><th>${L("결과", "Result")}</th></tr>
      ${rows.map(x => `<tr class="${x.c}"><td class="nw">${esc(x.kind)}</td><td class="nw">${esc(x.where)}</td><td class="mono">${esc(x.a)}</td><td>${esc(x.b)}</td></tr>`).join("")}</table>`
      : `<div class="empty">${L("확인할 것 없음 ✔", "Nothing to check ✔")}</div>`;
  }
}

// ================================================================ Excel download
function buildWorkbook(r) {
  const wb = XLSX.utils.book_new();
  const add = (name, aoa, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws["!cols"] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(L("발주", "Orders"), [[L("쇼핑몰", "Shop"), L("주문번호", "Order no."), L("받는 분", "Recipient"), L("연락처", "Phone"), L("주소", "Address"), L("상품명", "Product"), L("옵션", "Option"), L("수량", "Qty"), L("배송메모", "Note")],
    ...r.lines.map(l => [l.shop, l.no, l.to, l.phone, l.addr, l.name, l.option, l.q, l.memo]), [L("합계", "Total"), "", "", "", "", "", "", r.totals.lines, ""]], [10, 16, 10, 15, 42, 36, 16, 7, 24]);
  add(L("택배", "Parcels"), [[L("받는 분", "Recipient"), L("연락처", "Phone"), L("주소", "Address"), L("상품", "Items"), L("수량", "Qty"), L("주문번호", "Order no."), L("배송메모", "Note")],
    ...r.parcels.map(p => [p.to, p.phone, p.addr, [...p.items].map(([n, q]) => `${n} x${q}`).join(" / "), p.q, [...p.nos].join(", "), [...p.memo].join(" / ")]), [L("합계", "Total"), "", "", "", r.totals.parcels, "", ""]], [10, 15, 42, 50, 7, 22, 24]);
  const ws = r.weights, hasNoW = r.summary.some(s => !s.w);
  const head = [L("품목", "Item"), ...ws, ...(hasNoW ? [L("중량 없음", "No weight")] : []), L("총수량", "Total"), L("총무게(kg)", "Weight (kg)")];
  const body = r.items.map(it => {
    const cells = ws.map(w => r.summary.filter(s => s.item === it && s.w === w).reduce((a, s) => a + s.q, 0) || "");
    const nw = r.summary.filter(s => s.item === it && !s.w).reduce((a, s) => a + s.q, 0) || "";
    const tot = r.summary.filter(s => s.item === it).reduce((a, s) => a + s.q, 0);
    const kg = Math.round(r.summary.filter(s => s.item === it && s.grams).reduce((a, s) => a + s.q * s.grams / 1000, 0) * 10) / 10;
    return [it, ...cells, ...(hasNoW ? [nw] : []), tot, kg];
  });
  const totRow = [L("합계", "Total"), ...ws.map(w => r.summary.filter(s => s.w === w).reduce((a, s) => a + s.q, 0)), ...(hasNoW ? [r.summary.filter(s => !s.w).reduce((a, s) => a + s.q, 0)] : []), r.totals.summary, Math.round(body.reduce((a, b) => a + b[b.length - 1], 0) * 10) / 10];
  add(L("집계", "Summary"), [head, ...body, totRow], [32, ...ws.map(() => 9), ...(hasNoW ? [10] : []), 9, 11]);
  add(L("확인사항", "Notes"), [[L("구분", "Kind"), L("위치", "Where"), L("원래", "Was"), L("결과", "Result")],
    ...r.bad.map(b => [b.kind, b.where, b.detail, L("정리에서 빠짐", "left out")]),
    ...r.dups.map(d => [L("같은 주문 두 번", "Same order twice"), d.where, d.name, d.first]),
    ...r.excluded.map(x => [L("제외", "Left out"), x.where, `${x.name} x${x.q}`, ""]),
    ...r.notes.map(n => [n.kind, n.where, n.from, n.to]),
    [], [L("합계 확인", "Totals check"), `${L("원본", "orders")} ${r.totals.raw} / ${L("제외", "left out")} ${r.totals.excluded} / ${L("발주", "orders sheet")} ${r.totals.lines} / ${L("집계", "summary")} ${r.totals.summary} / ${L("택배", "parcels")} ${r.totals.parcels}`]], [18, 18, 44, 44]);
  return wb;
}
let downloads = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => { downloads = d; }).catch(() => { downloads = null; });
}
document.getElementById("btn-download").onclick = async () => {
  if (!RES || !RES.lines.length) return;
  const d = new Date(), name = `${L("발주정리", "orders")}_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.xlsx`;
  const out = XLSX.write(buildWorkbook(RES), { bookType: "xlsx", type: "array" });
  const blob = new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const box = document.getElementById("result");
  const note = (cls, text) => { const m = document.createElement("div"); m.className = "msg " + cls; m.textContent = text; box.prepend(m); setTimeout(() => m.remove(), 6000); };
  if (downloads) {
    try { await downloads.save({ filename: name, data: blob }); note("ok", L(`${name} 저장했습니다.`, `Saved ${name}.`)); }
    catch (e) { if (e && e.code !== "declined") note("bad", L("이 화면에서는 파일을 저장할 수 없습니다.", "Files can't be saved from this view.")); }
    return;
  }
  // opened as a file on the customer's own computer: normal browser download
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};
